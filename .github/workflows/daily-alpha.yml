name: Daily Overseas AI Alpha (CN)

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-alpha.mjs
      - run: |
          git config user.name "ai-alpha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/alpha.json docs/rss.xml docs/daily-copy.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(alpha): daily overseas AI intel refresh"
            git push
          fi
